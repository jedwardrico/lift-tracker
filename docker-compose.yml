services:
  api:
    build:
      context: ./server
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - db_data:/app/db
    environment:
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
