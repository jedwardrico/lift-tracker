name: EAS Update

on:
  push:
    branches:
      - main
    paths:
      - "lift-tracker/**"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lift-tracker/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: lift-tracker

      - name: Publish EAS Update
        run: npx eas-cli update --branch production --platform ios --message "Deploy ${{ github.sha }}"
        working-directory: lift-tracker
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
